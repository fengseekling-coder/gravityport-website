name = "gp-edge"
main = "src/index.js"
compatibility_date = "2026-08-22"

# Only reachable through the zone routes, which the zone rate limit covers.
# workers.dev and preview URLs bypass that limit, so they stay off (279 B5).
workers_dev = false
preview_urls = false

# Release packages and manifests. Real bucket is created outside this repository.
[[r2_buckets]]
binding = "RELEASES"
bucket_name = "gravityport-releases"

# Usage statistics (installs, daily activity, counters). Shared with the
# Pages visit counter (pages/wrangler.toml uses the same database id).
[[d1_databases]]
binding = "STATS"
database_name = "gp-stats"
database_id = "cfc7991a-7941-4e21-8120-0b54c75f8ca4"
migrations_dir = "migrations"

# One maintenance run per day, 11:17 UTC (~4am Los Angeles).
[triggers]
crons = ["17 11 * * *"]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

# Workers Logs would record full URLs, which carry the anonymous install_id,
# so it must stay off.
[observability]
enabled = false

# Cloudflare Access application protecting /admin/* on the legacy domain.
# Both must be configured at deploy time; when either is empty every /admin/*
# request is rejected (there is deliberately no "unconfigured" bypass).
[vars]
ACCESS_TEAM_DOMAIN = "azhui.cloudflareaccess.com"
ACCESS_AUD = "a493b069d961eda2bd033b73a41e0d70965085a809b790598b077aefcce005d8"
