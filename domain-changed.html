<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, follow" />
    <meta name="theme-color" content="#09090c" />
    <meta name="description" content="GravityPort 官网已更换域名，请通过新的官方地址访问。" />
    <link rel="canonical" href="https://gravityport.azhuilab.com/" />
    <title>官网地址已更新 · GravityPort</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #09090c;
        color: #f4f2f8;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 32px 20px;
        background:
          radial-gradient(ellipse at 50% 0%, rgb(116 82 212 / 20%), transparent 55%),
          radial-gradient(ellipse at 100% 100%, rgb(54 139 162 / 12%), transparent 44%),
          #09090c;
      }

      main {
        width: min(100%, 720px);
        padding: clamp(28px, 7vw, 64px);
        border: 1px solid rgb(255 255 255 / 12%);
        border-radius: 28px;
        background: linear-gradient(145deg, rgb(255 255 255 / 7%), rgb(255 255 255 / 3%));
        box-shadow: 0 32px 100px rgb(0 0 0 / 45%);
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 56px;
        color: inherit;
        font-size: 18px;
        font-weight: 650;
        letter-spacing: .02em;
        text-decoration: none;
      }

      .brand-mark {
        display: grid;
        width: 36px;
        height: 36px;
        place-items: center;
        border: 1px solid rgb(198 185 255 / 44%);
        border-radius: 12px;
        background: linear-gradient(145deg, rgb(147 118 246 / 32%), rgb(64 187 191 / 18%));
        color: #e8e1ff;
        font-size: 18px;
        font-weight: 700;
      }

      .eyebrow {
        margin: 0 0 18px;
        color: #b7a7f4;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: .16em;
      }

      h1 {
        max-width: 560px;
        margin: 0;
        font-size: clamp(34px, 7vw, 58px);
        line-height: 1.12;
        letter-spacing: -.045em;
      }

      .intro {
        max-width: 510px;
        margin: 22px 0 34px;
        color: #b8b5c2;
        font-size: 16px;
        line-height: 1.8;
      }

      .official-link {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        padding: 19px 22px;
        border: 1px solid rgb(183 167 244 / 38%);
        border-radius: 16px;
        background: rgb(123 92 220 / 15%);
        color: #fff;
        text-decoration: none;
        transition: border-color 160ms ease, background 160ms ease, transform 160ms ease;
      }

      .official-link:hover {
        transform: translateY(-2px);
        border-color: rgb(183 167 244 / 75%);
        background: rgb(123 92 220 / 23%);
      }

      .official-link:focus-visible {
        outline: 3px solid #c6b9ff;
        outline-offset: 4px;
      }

      .link-label { display: grid; gap: 6px; }
      .link-label small { color: #c2b7ea; font-size: 12px; }
      .link-label strong { font-size: 16px; font-weight: 650; overflow-wrap: anywhere; }
      .arrow { color: #c6b9ff; font-size: 24px; line-height: 1; }

      .english {
        margin: 34px 0 0;
        padding-top: 24px;
        border-top: 1px solid rgb(255 255 255 / 10%);
        color: #918e9b;
        font-size: 13px;
        line-height: 1.7;
      }

      .english a { color: #c6b9ff; text-underline-offset: 3px; }

      @media (max-width: 520px) {
        .brand { margin-bottom: 42px; }
        .official-link { align-items: flex-start; }
        .link-label strong { font-size: 14px; }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
      }
    </style>
  </head>
  <body>
    <main>
      <a class="brand" href="https://gravityport.azhuilab.com/" aria-label="GravityPort 官方网站">
        <span class="brand-mark" aria-hidden="true">G</span>
        <span>GravityPort</span>
      </a>
      <p class="eyebrow">OFFICIAL WEBSITE · DOMAIN UPDATED</p>
      <h1>官网地址已更新</h1>
      <p class="intro">GravityPort 官网已迁移至新的域名。请通过下方官方链接访问产品介绍、下载页面、安装指南与最新信息。原 MOSA 域名不再用于官网页面。</p>
      <a class="official-link" href="https://gravityport.azhuilab.com/">
        <span class="link-label">
          <small>新的官方域名</small>
          <strong>https://gravityport.azhuilab.com</strong>
        </span>
        <span class="arrow" aria-hidden="true">↗</span>
      </a>
      <p class="english" lang="en">The GravityPort website has moved. Visit the new official website at <a href="https://gravityport.azhuilab.com/">gravityport.azhuilab.com</a>.</p>
    </main>
  </body>
</html>
